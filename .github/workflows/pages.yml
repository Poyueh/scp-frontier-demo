name: Deploy SCP Frontier release
on:
  push:
    branches: [main]
    paths: ['trial/current.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag (for example v0.0.2)
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Poyueh/scp-frontier-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir release
          if [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t BASELINE < <(python3 -c 'import json; m=json.load(open("trial/current.json")); print(m.get("baseline_repository", "Poyueh/scp-frontier-demo")); print(m["baseline_tag"]); print(m["baseline_archive"]["name"])')
            BASELINE_REPO="${BASELINE[0]}"
            RELEASE_TAG="${BASELINE[1]}"
            ARCHIVE_NAME="${BASELINE[2]}"
            [[ "$BASELINE_REPO" == "Poyueh/scp-frontier-demo" || "$BASELINE_REPO" == "Poyueh/cyber-kingdom-demo" ]] || exit 1
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$ARCHIVE_NAME" =~ ^[A-Za-z0-9._-]+\.zip$ ]] || exit 1
            python3 -c 'import sys,urllib.request; repo,tag,name=sys.argv[1:]; urllib.request.urlretrieve("https://github.com/"+repo+"/releases/download/"+tag+"/"+name,"release/"+name)' "$BASELINE_REPO" "$RELEASE_TAG" "$ARCHIVE_NAME"
            python3 -m unittest discover -s tools -p 'test_*.py'
            python3 tools/apply_trial.py --baseline-archive "release/$ARCHIVE_NAME" --site _site --request trial/current.json
            gh release download v0.0.2 --repo "$GITHUB_REPOSITORY" --dir release --pattern SCP-Frontier-Web-0.0.2.zip --clobber
            mkdir -p _site/legacy
            python3 tools/apply_trial.py --baseline-archive release/SCP-Frontier-Web-0.0.2.zip --site _site/legacy/v0.0.4 --request trial/legacy-v004/current.json
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern "SCP-Frontier-Web-${RELEASE_TAG#v}.zip" --pattern SHA256SUMS.txt
            python3 tools/unpack_release.py --release release --site _site --tag "$RELEASE_TAG"
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
