name: Deploy SCP Frontier release
on:
  push:
    branches: [main]
    paths: ['trial/current.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag (for example v0.0.2)
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Poyueh/scp-frontier-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            RELEASE_TAG=$(python3 -c 'import json; print(json.load(open("trial/current.json"))["baseline_tag"])')
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern "SCP-Frontier-Web-${RELEASE_TAG#v}.zip" --pattern SHA256SUMS.txt
          if [[ "$EVENT_NAME" == "push" ]]; then
            python3 -c 'import hashlib,json,pathlib; m=json.load(open("trial/current.json"))["baseline_archive"]; p=pathlib.Path("release")/m["name"]; data=p.read_bytes(); assert len(data)==m["size"] and hashlib.sha256(data).hexdigest()==m["sha256"], "Pinned baseline archive mismatch"'
          fi
          python3 tools/unpack_release.py --release release --site _site --tag "$RELEASE_TAG"
      - name: Verify and stage the exact tested trial
        if: github.event_name == 'push'
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/apply_trial.py --site _site --request trial/current.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
